<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML SEO</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
    <nav class="rail" aria-label="Sections">
        <div class="rail-brand" title="HTML SEO"><img src="icon48.png" alt="HTML SEO"></div>

        <button class="rail-btn" data-tab="overview" title="Overview" aria-label="Overview">
            <svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="2"/><rect x="14" y="3" width="7" height="7" rx="2"/><rect x="3" y="14" width="7" height="7" rx="2"/><rect x="14" y="14" width="7" height="7" rx="2"/></svg>
            <span class="rail-pill" hidden></span>
        </button>
        <button class="rail-btn" data-tab="meta" title="Meta & social" aria-label="Meta and social">
            <svg viewBox="0 0 24 24"><path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7.5" cy="7.5" r="1.2"/></svg>
            <span class="rail-pill" hidden></span>
        </button>
        <button class="rail-btn" data-tab="content" title="Content" aria-label="Content">
            <svg viewBox="0 0 24 24"><path d="M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7z"/><path d="M14 2v5h5"/><path d="M8 13h8"/><path d="M8 17h6"/></svg>
            <span class="rail-pill" hidden></span>
        </button>
        <button class="rail-btn" data-tab="headings" title="Headings" aria-label="Headings">
            <svg viewBox="0 0 24 24"><path d="M6 12h12"/><path d="M6 20V4"/><path d="M18 20V4"/></svg>
            <span class="rail-pill" hidden></span>
        </button>
        <button class="rail-btn" data-tab="images" title="Images" aria-label="Images">
            <svg viewBox="0 0 24 24"><rect width="18" height="18" x="3" y="3" rx="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.1-3.1a2 2 0 0 0-2.8 0L6 21"/></svg>
            <span class="rail-pill" hidden></span>
        </button>
        <button class="rail-btn" data-tab="links" title="Links" aria-label="Links">
            <svg viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.5.5l3-3a5 5 0 0 0-7-7l-1.8 1.7"/><path d="M14 11a5 5 0 0 0-7.5-.5l-3 3a5 5 0 0 0 7 7l1.7-1.7"/></svg>
            <span class="rail-pill" hidden></span>
        </button>
        <button class="rail-btn" data-tab="schema" title="Schema" aria-label="Schema">
            <svg viewBox="0 0 24 24"><path d="M8 3H7a2 2 0 0 0-2 2v5a2 2 0 0 1-2 2 2 2 0 0 1 2 2v5a2 2 0 0 0 2 2h1"/><path d="M16 21h1a2 2 0 0 0 2-2v-5a2 2 0 0 1 2-2 2 2 0 0 1-2-2V5a2 2 0 0 0-2-2h-1"/></svg>
            <span class="rail-pill" hidden></span>
        </button>
        <button class="rail-btn" data-tab="indexing" title="Indexing" aria-label="Indexing">
            <svg viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/><path d="m8.5 11 2 2 3.5-3.5"/></svg>
            <span class="rail-pill" hidden></span>
        </button>
    </nav>

    <main class="main">
        <header class="topbar">
            <div class="topbar-text">
                <div class="topbar-title" id="page-title">Analyzing…</div>
                <div class="topbar-url" id="page-url"></div>
            </div>
            <div class="menu-wrap">
                <button class="icon-btn" id="export-btn" title="Export report" aria-label="Export report" aria-haspopup="menu" aria-expanded="false">
                    <svg viewBox="0 0 24 24"><path d="M12 3v12"/><path d="m7 10 5 5 5-5"/><path d="M5 21h14"/></svg>
                </button>
                <div class="menu" id="export-menu" role="menu" hidden>
                    <button role="menuitem" data-export="copy-md">Copy as Markdown</button>
                    <button role="menuitem" data-export="copy-json">Copy as JSON</button>
                    <button role="menuitem" data-export="dl-md">Download .md</button>
                    <button role="menuitem" data-export="dl-json">Download .json</button>
                </div>
            </div>
            <button class="icon-btn" id="popout" title="Open in a window" aria-label="Open in a window">
                <svg viewBox="0 0 24 24"><path d="M15 3h6v6"/><path d="M10 14 21 3"/><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>
            </button>
            <button class="icon-btn" id="settings-btn" title="Settings" aria-label="Settings" aria-pressed="false">
                <svg viewBox="0 0 24 24"><path d="M21 4h-7M10 4H3M21 12h-9M8 12H3M21 20h-5M12 20H3M14 2v4M8 10v4M16 18v4"/></svg>
            </button>
            <button class="icon-btn" id="refresh" title="Re-analyze page" aria-label="Re-analyze page">
                <svg viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-3-6.7L21 8"/><path d="M21 3v5h-5"/></svg>
            </button>
        </header>
        <section id="view" class="view" aria-live="polite"></section>
    </main>

    <img id="preview" class="preview" alt="" hidden>
    <div id="toast" class="toast" role="status" hidden></div>
    <script type="module" src="popup/main.js"></script>
</body>
</html>
